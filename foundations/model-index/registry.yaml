schema_version: 3

role_definitions:
  task-model: "能直接输出检测、分类、关键点或分割等任务结果。"
  backbone: "负责提取分层特征或视觉 token，供下游模块使用。"
  neck: "负责转换或融合 backbone 的跨层、跨尺度特征。"
  head: "负责把共享特征转换为分类、框、关键点或 mask 等任务输出。"
  component: "不适合归入 backbone、neck、head，但可复用的结构、损失、分配方法或后处理。"

families:
  - id: yolo
    name: YOLO
    path: families/yolo
    roles: [task-model]
    primary_tasks: [object-detection]
    status: working
    evidence_status: partial
    structure_review: accepted
    content_review: pending
    owner_use: confirmed
    scope: "主要、可追溯的实时检测分支，不穷举所有带 YOLO 名称的项目。"
    authority_note: "YOLOv3 之后没有覆盖全部分支的单一维护组织。"
    next_gate: "完成两个真实工程案例、查询检查和本人内容验收后，再决定是否合并主干或建设下一个模型族。"

  - id: turingvit
    name: TuringViT
    path: families/turingvit
    roles: [backbone]
    primary_tasks: [visual-encoding]
    status: working
    evidence_status: partial
    structure_review: pending
    content_review: pending
    owner_use: not-confirmed
    scope: "面向高分辨率图像与视频的视觉编码器；关注 TLA、动态分辨率、数据治理和硬件协同边界。"
    authority_note: "当前由小鹏官方项目页和论文定义；代码、权重与独立复现尚未公开。"
    next_gate: "等待代码或权重、第三方复现及真实目标硬件结果，再判断工程采用价值。"
