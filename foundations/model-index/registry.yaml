schema_version: 4

object_type_definitions:
  end-to-end-model-family: "能够以完整方案直接完成一个或多个视觉任务的可追溯模型谱系。"
  reusable-architecture-family: "可在不同完整方案中承担一个或多个模块角色的可追溯架构谱系。"
  reusable-component-family: "边界明确、可嵌入其他架构的组件谱系。"
  learning-or-alignment-family: "主要由训练目标、预训练方法或跨模态对齐方式定义的可追溯谱系。"

module_role_definitions:
  backbone: "为任务网络提取分层特征。"
  visual-encoder: "将图像或视频编码为可供下游消费的表示。"
  neck: "在主要特征提取与任务输出之间转换或融合特征。"
  adapter: "对齐分辨率、通道、模态或参数高效迁移接口。"
  head: "将上游特征转换为局部任务输出。"
  task-decoder: "通过 query、token 或迭代解码产生任务结果。"

families:
  - id: yolo
    name: YOLO
    path: families/yolo
    object_type: end-to-end-model-family
    module_roles: []
    primary_tasks: [object-detection]
    status: working
    evidence_status: partial
    structure_review: accepted
    content_review: pending
    owner_use: confirmed
    scope: "主要、可追溯的实时检测分支，不穷举所有带 YOLO 名称的项目。"
    authority_note: "YOLOv3 之后没有覆盖全部分支的单一维护组织。"
    next_gate: "完成两个真实工程案例、查询检查和本人内容验收后，再决定是否合并主干或建设下一个模型族。"

  - id: turingvit
    name: TuringViT
    path: families/turingvit
    object_type: reusable-architecture-family
    module_roles: [backbone, visual-encoder]
    primary_tasks: [visual-encoding]
    status: working
    evidence_status: partial
    structure_review: pending
    content_review: pending
    owner_use: not-confirmed
    scope: "面向高分辨率图像与视频的视觉编码器；关注 TLA、动态分辨率、数据治理和硬件协同边界。"
    authority_note: "当前由小鹏官方项目页和论文定义；代码、权重与独立复现尚未公开。"
    next_gate: "等待代码或权重、第三方复现及真实目标硬件结果，再判断工程采用价值。"
