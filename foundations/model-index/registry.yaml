    content_review: pending
    owner_use: not-confirmed
    scope: "Google MobileNetV1–V4 及其第一方硬件分支；不把 ShuffleNet、GhostNet、EfficientNet、MobileOne、RepViT 或通用轻量网络混入。"
    authority_note: "论文定义架构主线；固定 TensorFlow Models revision 定义可定位官方实现。官方概览与代码可能不同步，不能只依赖摘要页判断版本完整性。"
    next_gate: "先审查家族边界、来源责任和停止维护规则；真实采用需固定实现、任务消费者、runtime 与目标硬件后进入受控比较。"

