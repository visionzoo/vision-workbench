schema_version: 5

entity_kind_definitions:
  model-family: "以可追溯版本谱系维护的一组完整或近完整模型。"
  architecture-family: "主要由可复用结构机制和接口定义的架构谱系。"
  component-family: "边界明确、可嵌入其他架构的组件谱系。"
  method-family: "主要由训练、对齐、适配或推理方法定义的谱系。"

usage_scope_definitions:
  complete-solution: "能够在给定组合和配置下直接完成一个或多个视觉任务。"
  reusable-module: "能够作为其他系统中的可复用模块。"
  pretraining-source: "主要作为权重、表征或初始化来源被下游使用。"

module_role_definitions:
  backbone: "为具体任务系统提供可由 neck、head、decoder 或其他消费者使用的特征；输出可以是单尺度、分层或并行多分辨率。"
  visual-encoder: "将图像或视频编码为可供下游消费的表示。"
  neck: "在主要特征提取与任务输出之间转换或融合特征。"
  head: "将上游特征转换为局部任务输出。"
  task-decoder: "通过 query、token 或迭代解码产生任务结果。"

families:
  - id: yolo
    name: YOLO
    path: families/yolo
    entity_kind: model-family
    usage_scopes: [complete-solution]
    module_roles: []
    learning_paradigms: [supervised]
    tasks: [object-detection]
    system_contexts: []
    relations: []
    status: working
    evidence_status: partial
    structure_review: accepted
    content_review: pending
    owner_use: confirmed
    scope: "主要、可追溯的实时检测分支，不穷举所有带 YOLO 名称的项目。"
    authority_note: "YOLOv3 之后没有覆盖全部分支的单一维护组织。"
    next_gate: "完成两个真实工程案例、查询检查和本人内容验收后，再决定是否合并主干或建设下一个模型族。"

  - id: turingvit
    name: TuringViT
    path: families/turingvit
    entity_kind: architecture-family
    usage_scopes: [reusable-module]
    module_roles: [backbone, visual-encoder]
    learning_paradigms: []
    tasks: []
    system_contexts: []
    relations: []
    status: working
    evidence_status: partial
    structure_review: pending
    content_review: pending
    owner_use: not-confirmed
    scope: "面向高分辨率图像与视频的视觉编码器；关注 TLA、动态分辨率、数据治理和硬件协同边界。"
    authority_note: "当前由小鹏官方项目页和论文定义；代码、权重与独立复现尚未公开。"
    next_gate: "等待代码或权重、第三方复现及真实目标硬件结果，再判断工程采用价值。"
