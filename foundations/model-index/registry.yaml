    authority_note: "论文定义方法主线；固定官方仓库和模型卡定义可加载 backbone、token/feature 接口、权重与许可。动态 README 中的领域项目和 post-hoc 适配只建立关系。"
    next_gate: "先审查方法边界、数据/权重/许可和停止维护规则；真实采用需固定 architecture、checkpoint、consumer、adaptation budget、runtime 与任务 Oracle 后比较。"

